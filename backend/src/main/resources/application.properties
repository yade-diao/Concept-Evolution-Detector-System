spring.application.name=ced-api

# The schema is owned by the migrations in db/migration, so Hibernate validates
# against it and never alters it. `validate` turns a drift between entity and
# table into a startup failure naming the column, instead of a silently altered
# production schema or a query that fails at runtime.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# No default. A signing secret that falls back to a value in a repository is one
# every deployment shares, so the application refuses to start without one.
# Generate: openssl rand -base64 48
ced.jwt.secret=${CED_JWT_SECRET}
ced.jwt.lifetime=PT2H

spring.datasource.url=${CED_DB_URL:jdbc:postgresql://localhost:5432/ced}
spring.datasource.username=${CED_DB_USER:ced}
spring.datasource.password=${CED_DB_PASSWORD:ced}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Behind the deployment's reverse proxy, so the client address in a request is
# the one the proxy recorded, not the proxy's own. Trusting those headers is
# only sound because nothing but the proxy can route to this service - it
# publishes no port of its own.
server.forward-headers-strategy=framework

# A guest account and everything it owns is deleted this long after it is
# created.
#
# A day, not a week, because a guest session is scoped to the browser tab that
# started it: the token is the only handle on the account - there is no address
# to look it up by and no password to sign back in with - and the page keeps it
# in session storage, which the browser discards when the tab closes. So a guest
# row outlives its only owner almost immediately, and this is how long it takes
# to notice.
ced.guest.lifetime=P1D

# The one address that becomes an administrator when it registers. Empty means
# there is no administrator, which is the right default for a deployment nobody
# has configured.
ced.admin-email=

# How many runs an account may keep. Guests get less: an account anyone can have
# for the asking should not be able to reserve as much.
ced.limits.runs-per-user=200
ced.limits.runs-per-guest=20

# How many bytes of uploaded datasets one account may keep: 25 MiB. Uploading is
# optional - the browser can read a file, cache it and run on it without the
# server seeing it - so this is the size of the convenience, not of the tool.
ced.limits.dataset-bytes-per-user=26214400

# Attempts per minute per address against /api/v1/auth. BCrypt costs the server
# 50-100ms per attempt, so this is a CPU limit as much as a password-guessing
# one.
ced.rate-limit.enabled=true
ced.rate-limit.auth-per-minute=20

# ── Mail ──────────────────────────────────────────────────────────────────
#
# This host cannot deliver mail itself: Azure blocks outbound port 25 on every
# virtual machine, and a *.cloudapp.azure.com name cannot carry MX records, so
# it cannot receive any either. Mail goes out through a relay on 587 and
# feedback comes back through the application.
#
# With no host configured, registration stays one step and verification codes
# are only written to the mail log - a deployment that cannot send mail must not
# have a sign-up nobody can finish.
ced.mail.host=
ced.mail.port=587
ced.mail.username=
ced.mail.password=
ced.mail.from=
ced.mail.code-lifetime=PT15M
