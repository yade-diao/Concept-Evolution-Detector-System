# Test-only configuration.
#
# The application deliberately has no default signing secret: one committed to a
# repository is one every deployment shares, so production reads CED_JWT_SECRET
# from the environment and refuses to start without it. That leaves the tests
# needing a secret of their own, which is this file — it is on the test
# classpath only and can never be what a deployment picks up.
ced.jwt.secret=test-only-signing-secret-not-used-anywhere-else

# The database comes from Testcontainers via @ServiceConnection, so no URL here.
# Flyway runs against it, which is the point: the migrations are exercised by
# every test rather than trusted.

# The suite authenticates far more often than a person would, and it is not the
# limiter under test except where a test turns it back on.
ced.rate-limit.enabled=false
ced.admin-email=admin@example.com
