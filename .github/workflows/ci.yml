# Check the metrics against reference implementations, and run the detector on a
# stream whose answer is known.
#
# The metrics are the units every result here is reported in, and they are
# hand-written. A clustering that works and a metric that is wrong produce the
# same artifact — a plausible number — so the metrics are checked against
# scikit-learn rather than against themselves.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Metrics agree with scikit-learn
        run: python -m pytest tests/ -q

      # End to end on a stream built with the answer known: the clusters are
      # placed, moved and removed on purpose, so a detector that silently reports
      # one category for everything cannot pass by accident.
      - name: Detector recovers a known stream
        run: python -m experiments.synthetic_drift
