# Build the API and run its tests against a real database.
#
# The tests are integration tests on purpose: ownership isolation is a where
# clause, the run state machine is a set of constraints, and a 401 comes out of a
# filter chain. Mocking any of those would test the mock. Testcontainers starts
# PostgreSQL, Flyway migrates it, and Hibernate validates the entities against
# the result — so a migration that drifts from the code fails here rather than on
# the first deployment.
name: backend

on:
  push:
    branches: [main, master]
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Docker is present on ubuntu-latest, which is what Testcontainers needs.
      - name: Build and test
        run: ./mvnw -B verify

      - name: Publish test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  # The image every deployment pulls. Built only after the tests pass, and only
  # on main: a branch that fails its integration tests must not be able to
  # produce something a server would run.
  publish:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags on purpose: `latest` is what the server's compose file follows,
      # and the commit SHA is what makes a rollback a one-line change rather
      # than an archaeology exercise.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ced-api:latest
            ghcr.io/${{ github.repository_owner }}/ced-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
