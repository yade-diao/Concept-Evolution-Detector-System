# Put the image CI just built on the server.
#
# Chained off the test workflows rather than off a push, so nothing reaches the
# server that did not first pass its tests. The API arrives as an image the
# server pulls from GHCR; the frontend is built here and rsynced up, because it
# is static files and an image for those would be a container that serves what
# Caddy already serves.
#
# This workflow never holds the database password or the signing secret - those
# live in /opt/ced/.env on the host and are not read from here.
#
# Skips itself, loudly but without failing, when the deployment secrets are not
# configured: a fork, or this repository before a server exists, should not have
# a permanently red workflow.
#
# Secrets:
#   DEPLOY_HOST     the server's hostname or IP
#   DEPLOY_USER     the user to ssh as, in the docker group
#   DEPLOY_SSH_KEY  that user's private key, the whole PEM including headers
name: deploy

on:
  workflow_run:
    workflows: [backend, frontend]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (a commit SHA pins it; latest follows main)'
        required: false
        default: latest

jobs:
  deploy:
    # A failed test run must not deploy. workflow_run fires either way, so the
    # conclusion is checked rather than assumed.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Names only, never values: a skipped deployment should say which secret
      # it could not find, or the reader is left with a green run that did
      # nothing and no way to tell why.
      - name: Check whether a server is configured
        id: configured
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USERNAME: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=""
          [ -n "$HOST" ] || missing="$missing DEPLOY_HOST"
          [ -n "$USERNAME" ] || missing="$missing DEPLOY_USER"
          [ -n "$KEY" ] || missing="$missing DEPLOY_SSH_KEY"

          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "All three deployment secrets are present; deploying to the server." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deployment skipped"
              echo
              echo "These repository secrets are empty or absent:**$missing**"
              echo
              echo "They must be **repository** secrets - Settings -> Secrets and"
              echo "variables -> Actions -> *Secrets* tab. Values under *Variables*,"
              echo "or under an environment, are not visible here. See deploy/README.md."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v4
        if: steps.configured.outputs.ready == 'true'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The build copies datasets/bundled into dist, so the page and the files
      # it fetches end up on one origin - which is what makes CORS a
      # non-question for this deployment.
      - name: Build the site
        if: steps.configured.outputs.ready == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Authorise
        if: steps.configured.outputs.ready == 'true'
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pinning the host key rather than accepting whatever answers: this
          # step hands a key to whatever is on the other end.
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # Only the two files that describe the stack. The server's .env is never
      # touched: it holds the only secrets the deployment has.
      - name: Send the compose file and the proxy configuration
        if: steps.configured.outputs.ready == 'true'
        run: |
          rsync -az -e "ssh -i ~/.ssh/id_deploy" \
            deploy/compose.yml deploy/Caddyfile \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/ced/"

      # --delete so a file that left the build leaves the server. site/ holds
      # nothing but build output, which is what makes deleting safe here.
      - name: Send the site
        if: steps.configured.outputs.ready == 'true'
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/id_deploy" \
            frontend/dist/ \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/ced/site/"

      # The remote script arrives on stdin, quoted, so nothing in it is expanded
      # by this runner's shell before it gets there.
      - name: Pull and restart
        if: steps.configured.outputs.ready == 'true'
        env:
          TAG: ${{ github.event.inputs.tag || 'latest' }}
        run: |
          ssh -i ~/.ssh/id_deploy \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "CED_IMAGE_TAG='${TAG}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/ced
          export CED_IMAGE_TAG
          docker compose --env-file .env pull api
          docker compose --env-file .env up -d

          # Wait for the API to report healthy rather than for the container to
          # exist: Flyway migrates before the port opens, and a deploy that
          # returned while the schema was mid-migration has told you nothing.
          # The container's own HEALTHCHECK is what is read, so this asks the
          # application, not the proxy in front of it.
          for _ in $(seq 1 30); do
            id=$(docker compose ps -q api)
            status=$(docker inspect --format '{{.State.Health.Status}}' "$id" 2>/dev/null || echo starting)
            if [ "$status" = healthy ]; then
              echo "API healthy"
              exit 0
            fi
            sleep 5
          done

          echo "API did not become healthy in 150s" >&2
          docker compose logs --tail 50 api >&2
          exit 1
          REMOTE

      - name: Clean up images the server no longer runs
        if: steps.configured.outputs.ready == 'true'
        run: |
          ssh -i ~/.ssh/id_deploy \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "docker image prune -af --filter 'until=168h'"
